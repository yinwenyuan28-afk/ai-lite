# 依赖更新策略：只接受补丁/小版本，大版本跳跃必须人工评估后手动升级。
#
# 为什么收紧：本项目的兼容基线是 JDK 8 + Spring Boot 2.1/2.7，很多库的大版本
# 会直接打破这个基线（OkHttp 5 要求 JDK 8+ 但改了 API 与默认行为；Kotlin 2.x
# 需要重写协程桥接；assertj/javadoc 插件的新版与 Boot 2.1 BOM 冲突）。Dependabot
# 自动开大版本 PR 只会制造一批必然红灯的 PR，故在此禁止。
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 只提 patch 更新；minor 也限制为同一小版本内（semver-major 一律不自动提）。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Boot 2.x 基线：Boot 相关依赖由 BOM 管理，禁止 Dependabot 单独升级。
      - dependency-name: "org.springframework.boot:*"
      - dependency-name: "org.springframework:*"
      # 以下依赖的小版本升级也会破坏基线，必须人工逐个评估（2026-10-28 实测）：
      # - compiler-plugin 3.16 要求 Maven 3.6.3+（本机 3.6.2 被拒），且默认编译行为变化
      # - coroutines 1.11 依赖 kotlin-stdlib 2.2.20，与项目固定的 Kotlin 1.9.25 冲突
      # - japicmp 0.26 的 excludes 语义变化，会改变契约检查结果
      # - assertj 3.27 跨 16 个 minor，断言 API 有移除
      # 这些升级由人工判断后改 pom，不走自动化 PR。
      - dependency-name: "com.github.siom79.japicmp:japicmp-maven-plugin"
      - dependency-name: "org.apache.maven.plugins:maven-compiler-plugin"
      - dependency-name: "org.apache.maven.plugins:maven-jar-plugin"
      - dependency-name: "org.apache.maven.plugins:maven-source-plugin"
      - dependency-name: "org.apache.maven.plugins:maven-javadoc-plugin"
      - dependency-name: "org.assertj:assertj-core"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
      - dependency-name: "org.jetbrains.kotlin:*"
    groups:
      # 同类小更新合并成一个 PR，减少噪音。
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Actions 大版本同样不自动提：v6/v7 要求更高的 runner 基线，
      # 而本项目的 CI 要为 JDK 8 / Boot 2.1 环境保持兼容。
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
