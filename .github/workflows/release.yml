name: Release

# 打 v* tag 触发：先全量验证（含 Redis 集成用例），通过后
#  1) 收集全部模块制品为 workflow artifact（无需任何 secret，开箱即用）；
#  2) 若已配置 Maven Central 凭证与 GPG 密钥（见 docs/ref-发布.md），自动部署发布。

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Verify at tag
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and verify
        run: mvn -B verify
      - name: Collect artifacts
        run: |
          mkdir -p staging
          find . -path "*/target/*.jar" ! -name "original-*" -exec cp {} staging/ \;
          ls staging
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lite-${{ github.ref_name }}
          path: staging/

  deploy:
    name: Deploy to Maven Central
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先判断凭证是否齐备。不能把 gpg-private-key 直接写进 setup-java 的参数：
      # 未配置 secret 时该参数为空，setup-java 导入密钥失败会让整个 job 变红，
      # 走不到下面的「跳过部署」分支。
      - name: Check publishing prerequisites
        id: check
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          missing=""
          [ -z "$GPG_KEY" ] && missing="$missing GPG_PRIVATE_KEY"
          [ -z "$GPG_PASSPHRASE" ] && missing="$missing GPG_PASSPHRASE"
          [ -z "$CENTRAL_USERNAME" ] && missing="$missing CENTRAL_USERNAME"
          [ -z "$CENTRAL_PASSWORD" ] && missing="$missing CENTRAL_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::缺少发布凭证:$missing 。本次只验证并保留制品，不部署 Central（配置方法见 docs/ref-发布.md）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # central-publishing-maven-plugin 按 publishingServerId=central 从
      # settings.xml 的 <servers> 读凭证（不认 -Dcentral.username 这类系统属性）。
      # 生成到 ~/.m2/settings.xml，文件只存在于本次 job 的 runner 上。
      - name: Configure Maven settings for Central
        if: steps.check.outputs.ready == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -Prelease deploy -Dgpg.passphrase="$GPG_PASSPHRASE"
