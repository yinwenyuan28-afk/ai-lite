name: Release

# 打 v* tag 触发：先全量验证（含 Redis 集成用例），通过后
#  1) 收集全部模块制品为 workflow artifact（无需任何 secret，开箱即用）；
#  2) 若已配置 Maven Central 凭证与 GPG 密钥（见 docs/ref-发布.md），自动部署发布。

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Verify at tag
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and verify
        run: mvn -B verify
      - name: Collect artifacts
        run: |
          mkdir -p staging
          find . -path "*/target/*.jar" ! -name "original-*" -exec cp {} staging/ \;
          ls staging
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lite-${{ github.ref_name }}
          path: staging/

  deploy:
    name: Deploy to Maven Central
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "::warning::未配置 Maven Central 凭证（CENTRAL_USERNAME / CENTRAL_PASSWORD / GPG_PRIVATE_KEY / GPG_PASSPHRASE），跳过 Central 部署。tag 与制品仍有效，配置方法见 docs/ref-发布.md。"
            exit 0
          fi
          mvn -B -Prelease deploy \
            -Dgpg.passphrase="$GPG_PASSPHRASE" \
            -Dcentral.username="$CENTRAL_USERNAME" \
            -Dcentral.password="$CENTRAL_PASSWORD"
