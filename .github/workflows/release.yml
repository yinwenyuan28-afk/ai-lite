name: Release

# 打 v* tag 触发：先全量验证（含 Redis 集成用例），通过后
#  1) 收集全部模块制品为 workflow artifact（无需任何 secret，开箱即用）；
#  2) 若已配置 Maven Central 凭证与 GPG 密钥（见 docs/ref-发布.md），自动部署发布。

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Verify at tag
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # contract-check：拿本次构建产物与 ai-lite.release.version（上一个发布版）
      # 做二进制兼容性比对。删 public 方法、改参数类型、把类降级为包内可见都会让
      # release 直接失败，避免把破坏性变更发到 Central。内部实现（.internal.*）
      # 已在 japicmp 的 exclude 里，允许自由重构。
      - name: Build and verify (with API contract check)
        run: mvn -B verify -Pcontract-check
      - name: Collect artifacts
        run: |
          mkdir -p staging
          find . -path "*/target/*.jar" ! -name "original-*" -exec cp {} staging/ \;
          ls staging
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lite-${{ github.ref_name }}
          path: staging/

  deploy:
    name: Deploy to Maven Central
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先判断凭证是否齐备。不能把 gpg-private-key 直接写进 setup-java 的参数：
      # 未配置 secret 时该参数为空，setup-java 导入密钥失败会让整个 job 变红，
      # 走不到下面的「跳过部署」分支。
      - name: Check publishing prerequisites
        id: check
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          missing=""
          [ -z "$GPG_KEY" ] && missing="$missing GPG_PRIVATE_KEY"
          [ -z "$GPG_PASSPHRASE" ] && missing="$missing GPG_PASSPHRASE"
          [ -z "$CENTRAL_USERNAME" ] && missing="$missing CENTRAL_USERNAME"
          [ -z "$CENTRAL_PASSWORD" ] && missing="$missing CENTRAL_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::缺少发布凭证:$missing 。本次只验证并保留制品，不部署 Central（配置方法见 docs/ref-发布.md）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 部署前验一次凭证。判据说明（实测得出，勿改回无体探测）：
      #   * Central Portal 接受 Authorization: Bearer <base64(user:pass)>，
      #     插件 0.6.0 用的 UserToken 头同样被接受；
      #   * 但 /upload 只认 multipart，缺少上传体的请求一律返回 401/500，
      #     **不能**用来判断凭证好坏（曾据此误判 token 失效）。
      #   * 唯一可靠判据是带 bundle 的完整上传，因此这里只做连通性检查，
      #     凭证有效性交给真实的 mvn deploy 结论。
      - name: Verify Central endpoint reachable
        if: steps.check.outputs.ready == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 30 https://central.sonatype.com/api/v1/publisher/upload) || code=000
          echo "central.sonatype.com reachable: HTTP $code"
          case "$code" in
            000)
              echo "::error::无法连接 central.sonatype.com（网络或代理问题）。"
              exit 1
              ;;
          esac
          printf 'username length: %s\n' "${#CENTRAL_USERNAME}"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # central-publishing-maven-plugin 按 publishingServerId=central 从
      # settings.xml 的 <servers> 读凭证（不认 -Dcentral.username 这类系统属性）。
      # 生成到 ~/.m2/settings.xml，文件只存在于本次 job 的 runner 上。
      - name: Configure Maven settings for Central
        if: steps.check.outputs.ready == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          # 用 printf 逐行写出，避免 heredoc 的块缩进把空白带进 <username>/<password>
          # 内部（曾导致 Central 返回 401：凭证值前后多了空格）。
          # 先 trim 掉 secret 中可能混入的换行/空格。
          U="$(printf '%s' "$CENTRAL_USERNAME" | tr -d '[:space:]')"
          P="$(printf '%s' "$CENTRAL_PASSWORD" | tr -d '[:space:]')"
          mkdir -p "$HOME/.m2"
          {
            printf '%s\n' '<settings>'
            printf '%s\n' '  <servers>'
            printf '%s\n' '    <server>'
            printf '%s\n' '      <id>central</id>'
            printf '%s\n' "      <username>${U}</username>"
            printf '%s\n' "      <password>${P}</password>"
            printf '%s\n' '    </server>'
            printf '%s\n' '  </servers>'
            printf '%s\n' '</settings>'
          } > "$HOME/.m2/settings.xml"
          echo "settings.xml written; username length=${#U}"

      # gpg 插件 1.6 的口令入口是 passphrase 参数（无 gpgPassphraseEnvName），
      # 直接用 shell 变量展开传入，避免在命令行里明文出现。
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy -Dgpg.passphrase="$GPG_PASSPHRASE"
