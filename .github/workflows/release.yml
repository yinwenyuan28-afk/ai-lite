name: Release

# 打 v* tag 触发：先全量验证（含 Redis 集成用例），通过后
#  1) 收集全部模块制品为 workflow artifact（无需任何 secret，开箱即用）；
#  2) 若已配置 Maven Central 凭证与 GPG 密钥（见 docs/ref-发布.md），自动部署发布。

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Verify at tag
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and verify
        run: mvn -B verify
      - name: Collect artifacts
        run: |
          mkdir -p staging
          find . -path "*/target/*.jar" ! -name "original-*" -exec cp {} staging/ \;
          ls staging
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lite-${{ github.ref_name }}
          path: staging/

  deploy:
    name: Deploy to Maven Central
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先判断凭证是否齐备。不能把 gpg-private-key 直接写进 setup-java 的参数：
      # 未配置 secret 时该参数为空，setup-java 导入密钥失败会让整个 job 变红，
      # 走不到下面的「跳过部署」分支。
      - name: Check publishing prerequisites
        id: check
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          missing=""
          [ -z "$GPG_KEY" ] && missing="$missing GPG_PRIVATE_KEY"
          [ -z "$GPG_PASSPHRASE" ] && missing="$missing GPG_PASSPHRASE"
          [ -z "$CENTRAL_USERNAME" ] && missing="$missing CENTRAL_USERNAME"
          [ -z "$CENTRAL_PASSWORD" ] && missing="$missing CENTRAL_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::缺少发布凭证:$missing 。本次只验证并保留制品，不部署 Central（配置方法见 docs/ref-发布.md）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 部署前先验一次凭证，避免构建跑完后才发现 401：
      # 对 Central 的 upload 端点发一个无体的 POST，401/403 即凭证无效。
      - name: Verify Central credentials
        if: steps.check.outputs.ready == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          USERNAME="$(printf '%s' "$CENTRAL_USERNAME" | tr -d '[:space:]')"
          PASSWORD="$(printf '%s' "$CENTRAL_PASSWORD" | tr -d '[:space:]')"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -u "$USERNAME:$PASSWORD" \
            -X POST https://central.sonatype.com/api/v1/publisher/upload) || code=000
          echo "Central credential check HTTP status: $code"
          # 只打印长度与是否为纯可见 ASCII，不泄露内容：
          # 常见故障是 secret 里混入换行/空格、或贴成了 base64 整串。
          printf 'username: len=%s alnum=%s\n' "${#USERNAME}" \
            "$(printf '%s' "$USERNAME" | grep -qE '^[A-Za-z0-9]+$' && echo yes || echo NO)"
          printf 'password: len=%s alnum=%s hasNewline=%s\n' "${#PASSWORD}" \
            "$(printf '%s' "$PASSWORD" | grep -qE '^[A-Za-z0-9+/=._-]+$' && echo yes || echo NO)" \
            "$(printf '%s' "$CENTRAL_PASSWORD" | grep -q $'\n' && echo YES || echo no)"
          case "$code" in
            401|403)
              echo "::error::Central 拒绝凭证（HTTP $code）。请确认 CENTRAL_USERNAME 是 Portal 上 User Token 的 Username（短串，如 HvyJmf），CENTRAL_PASSWORD 是紧随其后的长密码；不要填 (base64) 那一行，也不要只填 namecode 之外的部分。若刚重新生成过 token，旧 token 已自动失效。"
              exit 1
              ;;
            000)
              echo "::error::无法连接 central.sonatype.com。"
              exit 1
              ;;
            *)
              echo "凭证有效（非 401 即表示 Basic Auth 已通过）。"
              ;;
          esac

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # central-publishing-maven-plugin 按 publishingServerId=central 从
      # settings.xml 的 <servers> 读凭证（不认 -Dcentral.username 这类系统属性）。
      # 生成到 ~/.m2/settings.xml，文件只存在于本次 job 的 runner 上。
      - name: Configure Maven settings for Central
        if: steps.check.outputs.ready == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          # 用 printf 逐行写出，避免 heredoc 的块缩进把空白带进 <username>/<password>
          # 内部（曾导致 Central 返回 401：凭证值前后多了空格）。
          # 先 trim 掉 secret 中可能混入的换行/空格。
          U="$(printf '%s' "$CENTRAL_USERNAME" | tr -d '[:space:]')"
          P="$(printf '%s' "$CENTRAL_PASSWORD" | tr -d '[:space:]')"
          mkdir -p "$HOME/.m2"
          {
            printf '%s\n' '<settings>'
            printf '%s\n' '  <servers>'
            printf '%s\n' '    <server>'
            printf '%s\n' '      <id>central</id>'
            printf '%s\n' "      <username>${U}</username>"
            printf '%s\n' "      <password>${P}</password>"
            printf '%s\n' '    </server>'
            printf '%s\n' '  </servers>'
            printf '%s\n' '</settings>'
          } > "$HOME/.m2/settings.xml"
          echo "settings.xml written; username length=${#U}"

      # gpg 插件 1.6 的口令入口是 passphrase 参数（无 gpgPassphraseEnvName），
      # 直接用 shell 变量展开传入，避免在命令行里明文出现。
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy -Dgpg.passphrase="$GPG_PASSPHRASE"
