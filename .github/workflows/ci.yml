name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: JDK ${{ matrix.java }} / Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '8'
            boot: '2.1.10.RELEASE'
          - java: '8'
            boot: '2.7.18'
          - java: '17'
            boot: '2.7.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build
        run: mvn -B -Dspring-boot.version=${{ matrix.boot }} verify

  jdk21:
    name: JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build including virtual-thread module
        run: mvn -B verify
