spring:
  profiles:
    include: local
  datasource:
    url: jdbc:sqlite:data/ai-lite-demo.db
    driver-class-name: org.sqlite.JDBC
    initialization-mode: always
  sql:
    init:
      mode: always

ai-lite:
  enabled: true
  admin:
    enabled: true
    page-enabled: true
  llm:
    biz-ids:
      - demo-chat
    providers:
      wangxin:
        api: openai-completions
        base-url: https://tq.insigma-dev.com/doapi/insigma-ddd-ops/open/access/ai/v1
        connect-timeout-ms: 10000
        read-timeout-ms: 120000
  executor:
    mode: platform
  session:
    enabled: true
  context:
    enabled: true
    budget:
      reserve-tokens: 8192
    compaction:
      enabled: true
      keep-recent-tokens: 12000
      summary-max-tokens: 2048
      timeout-ms: 60000
      max-per-run: 3
    tool-result:
      enabled: true
      max-chars: 2000
  store:
    jdbc:
      table-name: AI_LITE_LLM_CALL

ai-lite.demo:
  run: false
  prompt: 用一句话介绍你自己
